<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prijava | Biblioteka</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef1f5;color:#263445;font:14px/1.5 "Segoe UI",Arial,sans-serif}.box{width:min(390px,100%);background:white;border:1px solid #dfe4ea;border-radius:12px;padding:31px;box-shadow:0 8px 30px #26384c0b}.box h1{margin:0;font-size:27px;font-weight:650;color:#23364b}.intro{color:#738092;margin:6px 0 23px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:650;color:#536176;margin-bottom:6px}.field input{width:100%;border:1px solid #cbd3dd;border-radius:7px;padding:11px;font:inherit}.field input:focus{outline:2px solid #d7e5f7;border-color:#7295c1}button{width:100%;padding:11px;border:0;border-radius:7px;background:#3768a8;color:white;font-weight:650;font-size:14px;cursor:pointer;margin-top:8px}button:hover{background:#2b568c}.error{background:#fff1f0;color:#a83232;border:1px solid #f0ceca;padding:10px;border-radius:7px;margin:12px 0}.help{margin-top:18px;color:#7a8797;font-size:12px}
</style></head><body><section class="box"><h1>Biblioteka</h1><p class="intro">Prijava za bibliotekara</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="{{ 'error' if category == 'error' else 'help' }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><div class="field"><label for="username">Korisničko ime</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Lozinka</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">Prijavi se</button></form>
<p class="help">Pristup je namenjen zaposlenima u biblioteci.</p></section></body></html>
